      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 60s

  csrs-init:
    image: mongo:8.0
    container_name: csrs-init
    network_mode: "service:configsvr1"
    command: >
      bash -c "
        until mongosh --port 27019 --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; do sleep 2; done &&
        mongosh --port 27019 --quiet --eval '
          try {
            rs.status();
            print(\"[skip] csrs already initialized\");
          } catch(e) {
            var s = String(e);
            if (s.match(/auth|Unauthorized|not authorized/i) || e.code === 13 || e.code === 18) {
              print(\"[skip] csrs: users exist, RS assumed initialized\");
            } else {
              rs.initiate({
                _id: \"csrs\",
                configsvr: true,
                members: [
                  { _id: 0, host: \"configsvr1:27019\", priority: 2 },
                  { _id: 1, host: \"configsvr2:27019\", priority: 1 },
                  { _id: 2, host: \"configsvr3:27019\", priority: 1 }
                ]
              });
              print(\"[done] csrs initialized\");
            }
          }
        '
      "
    depends_on:
      keyfile-init:
        condition: service_completed_successfully
      configsvr1:
        condition: service_healthy
      configsvr2:
        condition: service_healthy
      configsvr3:
        condition: service_healthy
    restart: "no"

  rs1-init:
    image: mongo:8.0
    container_name: rs1-init
    network_mode: "service:shard1-1"
    command: >
      bash -c "
        until mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; do sleep 2; done &&
