      --dbpath /data/db --bind_ip_all
      --wiredTigerCacheSizeGB 0.5
    volumes:
      - shard1-2-data:/data/db
    networks:
      - mongo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  shard1-3:
    image: mongo:8.0
    container_name: shard1-3
    hostname: shard1-3
    command: >
      mongod --shardsvr --replSet rs1 --port 27018
