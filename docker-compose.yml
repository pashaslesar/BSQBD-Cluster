networks:
  mongo-net:
    driver: bridge

volumes:
  keyfile-data:
  configsvr1-data:
  configsvr2-data:
  configsvr3-data:
  shard1-1-data:
  shard1-2-data:
  shard1-3-data:
  shard2-1-data:
  shard2-2-data:
  shard2-3-data:
  shard3-1-data:
  shard3-2-data:
  shard3-3-data:

services:

  keyfile-init:
    image: mongo:8.0
    container_name: keyfile-init
    command: >
      bash -c "
        if [ ! -f /keyfile/mongodb.key ]; then
          openssl rand -base64 756 > /keyfile/mongodb.key &&
          chmod 400 /keyfile/mongodb.key &&
          chown 999:999 /keyfile/mongodb.key &&
          echo '[done] Keyfile generated';
        else
          echo '[skip] Keyfile already exists';
        fi
      "
    volumes:
      - keyfile-data:/keyfile
    networks:
      - mongo-net
    restart: "no"

  configsvr1:
    image: mongo:8.0
    container_name: configsvr1
    hostname: configsvr1
    command: >
      mongod --configsvr --replSet csrs --port 27019
      --dbpath /data/db --bind_ip_all
      --wiredTigerCacheSizeGB 0.25
      --keyFile /keyfile/mongodb.key
    volumes:
      - configsvr1-data:/data/db
      - keyfile-data:/keyfile:ro
    networks:
      - mongo-net
    depends_on:
      keyfile-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 60s

  configsvr2:
