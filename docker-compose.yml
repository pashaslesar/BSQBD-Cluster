      shard3-3:
        condition: service_healthy
    restart: "no"

  mongos:
    image: mongo:8.0
    container_name: mongos
    hostname: mongos
    entrypoint: ["/bin/bash", "/scripts/mongos-entrypoint.sh"]
    environment:
      MONGO_ADMIN_USER: admin
      MONGO_ADMIN_PASS: RestCluster2024!
      MONGO_APP_USER: appuser
      MONGO_APP_PASS: AppPass2024!
    volumes:
      - ./FunctionalSolution/scripts:/scripts:ro
      - ./Data:/csv-data:ro
      - keyfile-data:/keyfile:ro
    ports:
      - "27017:27017"
    networks:
      - mongo-net
    depends_on:
      csrs-init:
        condition: service_completed_successfully
      rs1-init:
        condition: service_completed_successfully
      rs2-init:
        condition: service_completed_successfully
      rs3-init:
        condition: service_completed_successfully
    restart: on-failure

  compass-web:
    image: haohanyang/compass-web:latest
    container_name: compass-web
    ports:
      - "8080:80"
    networks:
      - mongo-net
    restart: unless-stopped
