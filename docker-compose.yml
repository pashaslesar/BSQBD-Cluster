version: '3.8'

networks:
  mongo-net:
    driver: bridge

volumes:
  configsvr1-data:
  configsvr2-data:
  configsvr3-data:
  shard1-1-data:
  shard1-2-data:
  shard1-3-data:
  shard2-1-data:
  shard2-2-data:
  shard2-3-data:
  shard3-1-data:
  shard3-2-data:
  shard3-3-data:

services:
  configsvr1:
    image: mongo:8.0
    container_name: configsvr1
    hostname: configsvr1
    command: >
      mongod --configsvr --replSet csrs --port 27019
      --dbpath /data/db --bind_ip_all
      --wiredTigerCacheSizeGB 0.25
    volumes:
      - configsvr1-data:/data/db
    networks:
      - mongo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  configsvr2:
    image: mongo:8.0
    container_name: configsvr2
    hostname: configsvr2
    command: >
      mongod --configsvr --replSet csrs --port 27019
      --dbpath /data/db --bind_ip_all
      --wiredTigerCacheSizeGB 0.25
    volumes:
      - configsvr2-data:/data/db
    networks:
      - mongo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  configsvr3:
    image: mongo:8.0
    container_name: configsvr3
    hostname: configsvr3
    command: >
      mongod --configsvr --replSet csrs --port 27019
      --dbpath /data/db --bind_ip_all
      --wiredTigerCacheSizeGB 0.25
    volumes:
      - configsvr3-data:/data/db
    networks:
      - mongo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  shard1-1:
    image: mongo:8.0
    container_name: shard1-1
    hostname: shard1-1
    command: >
      mongod --shardsvr --replSet rs1 --port 27018
      --dbpath /data/db --bind_ip_all
      --wiredTigerCacheSizeGB 0.5
    volumes:
